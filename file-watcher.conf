# File Watcher Configuration
# 
# Each watch is defined by a [watch:name] section with the following options:
#   dir              - Directory to watch (required)
#   pattern          - Glob pattern to match (required)
#   dest             - Destination directory (required)
#   extract-archives - Extract from single-file archives (true/false, default: false)
#   poll-interval    - Polling interval in seconds (default: 5)
#   use-polling      - Force polling mode (true/false, default: false)
#
# Environment variables and ~ are expanded.

[watch:pdfs]
dir = ~/Downloads
pattern = *.pdf
dest = ~/Documents/PDFs
extract-archives = true

[watch:images]
dir = ~/Downloads
pattern = *.{jpg,jpeg,png,gif,webp}
dest = ~/Pictures

# Example: Watch for reports
# [watch:reports]
